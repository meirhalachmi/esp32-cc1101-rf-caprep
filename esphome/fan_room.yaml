# ============================================================
# One fan + light, instantiated per room from esphome_fan_controller.yaml:
#
#   packages:
#     office: !include
#       file: fan_room.yaml
#       vars: { room: office, name: Office, addr: "0xAACAC", even_parity: "false" }
#
# room:        id prefix (lowercase)
# name:        entity name prefix shown in Home Assistant
# addr:        the remote's 20-bit address
# even_parity: whether this remote makes the total number of ones even
# ============================================================

esphome:
  on_boot:
    # Before the radio starts listening (priority 600 in the main file).
    - priority: 700
      then:
        - lambda: |-
            fan_rf.add_fan(${addr}, ${even_parity}, [](uint16_t cmd) {
              id(${room}_rx)->execute(cmd);
            });

globals:
  - id: ${room}_fan_phys_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: ${room}_fan_phys_speed
    type: int
    restore_value: true
    initial_value: "1"
  - id: ${room}_fan_phys_reverse
    type: bool
    restore_value: true
    initial_value: "false"
  - id: ${room}_light_phys_on
    type: bool
    restore_value: true
    initial_value: "false"
  # Estimated dimmer step, 1..DIM_STEPS.  There is no absolute brightness
  # command, only LED+/LED-, so this is dead reckoning that re-anchors
  # whenever the slider goes to either end.
  - id: ${room}_light_phys_level
    type: int
    restore_value: true
    initial_value: "8"
  - id: ${room}_light_tx_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  # millis() at which the fan's own timer will switch it off; 0 = no timer.
  # Not restored: after a reboot we cannot know how much time was left.
  - id: ${room}_timer_end_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

fan:
  - platform: template
    id: ${room}_fan
    name: "${name} Fan"
    speed_count: 6
    # F/R is a toggle too, so direction is tracked like power.  Which way
    # "forward" spins is whatever was set with Sync Only on.
    has_direction: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lambda: |-
          if (!x->state) id(${room}_timer_end_ms) = 0;
          if (!fan_rf.ready()) return;
          int speed = x->speed >= 1 && x->speed <= 6 ? x->speed : id(${room}_fan_phys_speed);
          bool reverse = x->direction == fan::FanDirection::REVERSE;
          if (id(sync_only)) {
            id(${room}_fan_phys_on) = x->state;
            id(${room}_fan_phys_speed) = speed;
            id(${room}_fan_phys_reverse) = reverse;
            return;
          }
          if (reverse != id(${room}_fan_phys_reverse)) {
            fan_rf.send(${addr}, FAN_CMD_REVERSE);
            id(${room}_fan_phys_reverse) = reverse;
          }
          if (x->state) {
            // A speed command also switches the fan on, so it covers both
            // "turn on" and "change speed" without guessing at the toggle.
            if (!id(${room}_fan_phys_on) || speed != id(${room}_fan_phys_speed)) {
              fan_rf.send(${addr}, FAN_SPEED_CMDS[speed - 1]);
              id(${room}_fan_phys_on) = true;
              id(${room}_fan_phys_speed) = speed;
            }
          } else if (id(${room}_fan_phys_on)) {
            fan_rf.send(${addr}, FAN_CMD_TOGGLE);
            id(${room}_fan_phys_on) = false;
          }

# The light entity is dimmable; its output only hands the target to
# ${room}_light_sync, which decides what to transmit.
output:
  - platform: template
    id: ${room}_light_out
    type: float
    write_action:
      - lambda: 'id(${room}_light_sync)->execute(state);'

light:
  - platform: monochromatic
    id: ${room}_light
    name: "${name} Light"
    output: ${room}_light_out
    restore_mode: RESTORE_DEFAULT_OFF
    gamma_correct: 1.0            # brightness maps linearly onto dimmer steps
    default_transition_length: 0s

script:
  # Bring the physical light to `level` (0 = off, else brightness 0..1).
  # Restart mode plus the delay means a quick off-then-on from HA collapses:
  # the second light toggle waits until LIGHT_MIN_GAP_MS after the first, so
  # the fan never sees the fast double toggle that changes the colour.
  - id: ${room}_light_sync
    mode: restart
    parameters:
      level: float
    then:
      - delay: !lambda |-
          uint32_t since = millis() - id(${room}_light_tx_ms);
          return id(${room}_light_tx_ms) && since < LIGHT_MIN_GAP_MS ? LIGHT_MIN_GAP_MS - since : (uint32_t) 0;
      - lambda: |-
          if (!fan_rf.ready()) return;
          bool on = level > 0.0f;
          int step = std::max(1, std::min(DIM_STEPS, (int) lroundf(level * DIM_STEPS)));
          if (id(sync_only)) {
            id(${room}_light_phys_on) = on;
            if (on) id(${room}_light_phys_level) = step;
            return;
          }
          if (on != id(${room}_light_phys_on)) {
            fan_rf.send(${addr}, FAN_CMD_LIGHT);
            id(${room}_light_phys_on) = on;
            id(${room}_light_tx_ms) = millis();
          }
          if (!on || step == id(${room}_light_phys_level)) return;
          int cur = id(${room}_light_phys_level);
          // At either end, overshoot so the estimate re-anchors to reality.
          int n = step == DIM_STEPS ? DIM_STEPS - cur + DIM_OVERSHOOT
                : step == 1         ? cur - 1 + DIM_OVERSHOOT
                                    : abs(step - cur);
          uint16_t cmd = step > cur ? FAN_CMD_DIM_UP : FAN_CMD_DIM_DOWN;
          for (int i = 0; i < n; i++) fan_rf.send(${addr}, cmd);
          id(${room}_light_phys_level) = step;

  # A press on this room's remote: update the physical state, then mirror it
  # into the entities.  Their reconcile then finds nothing to send.
  - id: ${room}_rx
    mode: queued
    parameters:
      cmd: int
    then:
      - lambda: |-
          int speed = fan_speed_of(cmd);
          bool fan_changed = true;
          if (speed) {
            id(${room}_fan_phys_on) = true;
            id(${room}_fan_phys_speed) = speed;
          } else if (cmd == FAN_CMD_TOGGLE) {
            id(${room}_fan_phys_on) = !id(${room}_fan_phys_on);
          } else if (cmd == FAN_CMD_BREEZE) {
            id(${room}_fan_phys_on) = true;
          } else if (cmd == FAN_CMD_REVERSE) {
            id(${room}_fan_phys_reverse) = !id(${room}_fan_phys_reverse);
          } else if (cmd == FAN_CMD_TIMER_1H || cmd == FAN_CMD_TIMER_4H) {
            id(${room}_timer_end_ms) = millis() + (cmd == FAN_CMD_TIMER_1H ? 1 : 4) * 3600000UL;
            fan_changed = false;
          } else {
            fan_changed = false;
          }
          if (fan_changed) {
            auto *f = id(${room}_fan);
            f->state = id(${room}_fan_phys_on);
            f->speed = id(${room}_fan_phys_speed);
            f->direction = id(${room}_fan_phys_reverse) ? fan::FanDirection::REVERSE
                                                      : fan::FanDirection::FORWARD;
            f->publish_state();
          }

          bool light_changed = true;
          if (cmd == FAN_CMD_LIGHT) {
            id(${room}_light_phys_on) = !id(${room}_light_phys_on);
          } else if (cmd == FAN_CMD_DIM_UP && id(${room}_light_phys_on)) {
            id(${room}_light_phys_level) = std::min(DIM_STEPS, id(${room}_light_phys_level) + 1);
          } else if (cmd == FAN_CMD_DIM_DOWN && id(${room}_light_phys_on)) {
            id(${room}_light_phys_level) = std::max(1, id(${room}_light_phys_level) - 1);
          } else {
            light_changed = false;
          }
          if (light_changed) {
            auto call = id(${room}_light).make_call();
            call.set_state(id(${room}_light_phys_on));
            if (id(${room}_light_phys_on))
              call.set_brightness((float) id(${room}_light_phys_level) / DIM_STEPS);
            call.perform();
          }

  - id: ${room}_start_timer
    parameters:
      hours: int
    then:
      - lambda: |-
          fan_rf.send(${addr}, hours == 1 ? FAN_CMD_TIMER_1H : FAN_CMD_TIMER_4H);
          id(${room}_timer_end_ms) = millis() + hours * 3600000UL;

# The fan's own timer switches it off without a word on the air, so follow
# the countdown here and mark the fan off when it runs out.
interval:
  - interval: 10s
    then:
      - lambda: |-
          uint32_t end = id(${room}_timer_end_ms);
          if (!end || (int32_t) (millis() - end) < 0) return;
          id(${room}_timer_end_ms) = 0;
          id(${room}_fan_phys_on) = false;
          auto *f = id(${room}_fan);
          f->state = false;
          f->publish_state();

sensor:
  - platform: template
    name: "${name} Fan Timer"
    icon: "mdi:timer-sand"
    unit_of_measurement: min
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      uint32_t end = id(${room}_timer_end_ms);
      if (!end) return 0;
      int32_t left = (int32_t) (end - millis());
      return left > 0 ? (left + 59999) / 60000 : 0;

button:
  - platform: template
    name: "${name} Fan Breeze"
    icon: "mdi:weather-windy"
    on_press:
      - lambda: |-
          fan_rf.send(${addr}, FAN_CMD_BREEZE);
          id(${room}_rx)->execute(FAN_CMD_BREEZE);
  - platform: template
    name: "${name} Fan Timer 1H"
    icon: "mdi:timer-outline"
    on_press:
      - script.execute:
          id: ${room}_start_timer
          hours: 1
  - platform: template
    name: "${name} Fan Timer 4H"
    icon: "mdi:timer-outline"
    on_press:
      - script.execute:
          id: ${room}_start_timer
          hours: 4
  - platform: template
    name: "${name} Light Colour"
    icon: "mdi:palette"
    on_press:
      - lambda: 'fan_rf.send(${addr}, FAN_CMD_COLOUR);'
