# ============================================================
# ESPHome RF Fan Controller - CC1101 @ 433.92 MHz ASK/OOK
# ============================================================
# Protocol and command table: cc1101_fan_controller.h
#
# Wiring (ESP32 -> CC1101 module):
#   GPIO 18 -> SCK        GPIO 5  -> CSN
#   GPIO 19 -> MISO       GPIO 25 -> GDO0 (TX data)
#   GPIO 23 -> MOSI       GPIO 26 -> GDO2 (RX data)
#
# State model
# -----------
# The fans have no discrete "off": power is a toggle.  So for every fan we
# keep what we believe the *physical* fan is doing (the *_phys globals,
# restored from flash) separately from what Home Assistant asks for (the
# fan / light entities).  An HA change is reconciled against the physical
# state and only the commands needed to get there are sent.  A press on the
# original remote updates the physical state first and then the entity, so
# the reconcile that follows finds nothing to do and sends nothing.
#
# Rooms so far:
#   girls  -> 0xE5D7C  (even parity)
# ============================================================

substitutions:
  girls_addr: "0xE5D7C"

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller
  includes:
    # Vendored: the upstream manifest declares platform "esp32", which
    # ESPHome's ESP-IDF toolchain rejects (it wants "espressif32").
    - cc1101_lib/CC1101_ESP_Arduino.h
    - cc1101_lib/CC1101_ESP_Arduino.cpp
    - cc1101_fan_controller.h
  libraries:
    - SPI
  on_boot:
    priority: 600
    then:
      - lambda: |-
          fan_rf.add_fan(${girls_addr}, true);
          fan_rf.on_command = [](uint32_t addr, uint16_t cmd) {
            if (addr == ${girls_addr}) id(girls_rx)->execute(cmd);
          };
          fan_rf.begin();

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Fan-Controller-AP"
    password: "fan12345678"

captive_portal:

# State must survive a reboot: without it the power toggle has nothing to
# reason about.  The default 1-minute flush lost changes on an early reboot.
preferences:
  flash_write_interval: 5s

web_server:
  port: 80

interval:
  - interval: 20ms
    then:
      - lambda: 'fan_rf.poll();'

# ============================================================
# Physical state, as last commanded or heard
# ============================================================
globals:
  - id: girls_fan_phys_on
    type: bool
    restore_value: true
    initial_value: "false"
  - id: girls_fan_phys_speed
    type: int
    restore_value: true
    initial_value: "1"
  - id: girls_fan_phys_reverse
    type: bool
    restore_value: true
    initial_value: "false"
  - id: girls_light_phys_on
    type: bool
    restore_value: true
    initial_value: "false"
  # While on, entity changes only re-align the physical state; nothing is
  # transmitted.  Used to tell the controller what the room really looks like.
  - id: sync_only
    type: bool
    restore_value: false
    initial_value: "false"

# ============================================================
# Girls' room
# ============================================================
fan:
  - platform: template
    id: girls_fan
    name: "Girls Fan"
    speed_count: 6
    # F/R is a toggle too, so direction is tracked like power.  Which way
    # "forward" spins is whatever was set with Sync Only on.
    has_direction: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_state:
      - lambda: |-
          if (!fan_rf.ready()) return;
          int speed = x->speed >= 1 && x->speed <= 6 ? x->speed : id(girls_fan_phys_speed);
          bool reverse = x->direction == fan::FanDirection::REVERSE;
          if (id(sync_only)) {
            id(girls_fan_phys_on) = x->state;
            id(girls_fan_phys_speed) = speed;
            id(girls_fan_phys_reverse) = reverse;
            return;
          }
          if (reverse != id(girls_fan_phys_reverse)) {
            fan_rf.send(${girls_addr}, FAN_CMD_REVERSE);
            id(girls_fan_phys_reverse) = reverse;
          }
          if (x->state) {
            // A speed command also switches the fan on, so it covers both
            // "turn on" and "change speed" without guessing at the toggle.
            if (!id(girls_fan_phys_on) || speed != id(girls_fan_phys_speed)) {
              fan_rf.send(${girls_addr}, FAN_SPEED_CMDS[speed - 1]);
              id(girls_fan_phys_on) = true;
              id(girls_fan_phys_speed) = speed;
            }
          } else if (id(girls_fan_phys_on)) {
            fan_rf.send(${girls_addr}, FAN_CMD_TOGGLE);
            id(girls_fan_phys_on) = false;
          }

output:
  - platform: template
    id: girls_light_out
    type: binary
    write_action:
      - lambda: |-
          if (!fan_rf.ready()) return;
          if (id(sync_only)) {
            id(girls_light_phys_on) = state;
            return;
          }
          if (state != id(girls_light_phys_on)) {
            fan_rf.send(${girls_addr}, FAN_CMD_LIGHT);
            id(girls_light_phys_on) = state;
          }

light:
  - platform: binary
    id: girls_light
    name: "Girls Light"
    output: girls_light_out
    restore_mode: RESTORE_DEFAULT_OFF

script:
  # A press on the girls' remote: update the physical state, then mirror it
  # into the entities.  Their reconcile then finds nothing to send.
  - id: girls_rx
    mode: queued
    parameters:
      cmd: int
    then:
      - lambda: |-
          int speed = fan_speed_of(cmd);
          bool fan_changed = true;
          if (speed) {
            id(girls_fan_phys_on) = true;
            id(girls_fan_phys_speed) = speed;
          } else if (cmd == FAN_CMD_TOGGLE) {
            id(girls_fan_phys_on) = !id(girls_fan_phys_on);
          } else if (cmd == FAN_CMD_BREEZE) {
            id(girls_fan_phys_on) = true;
          } else if (cmd == FAN_CMD_REVERSE) {
            id(girls_fan_phys_reverse) = !id(girls_fan_phys_reverse);
          } else {
            fan_changed = false;
          }
          if (fan_changed) {
            auto *f = id(girls_fan);
            f->state = id(girls_fan_phys_on);
            f->speed = id(girls_fan_phys_speed);
            f->direction = id(girls_fan_phys_reverse) ? fan::FanDirection::REVERSE
                                                      : fan::FanDirection::FORWARD;
            f->publish_state();
          }
          if (cmd == FAN_CMD_LIGHT) {
            id(girls_light_phys_on) = !id(girls_light_phys_on);
            auto call = id(girls_light).make_call();
            call.set_state(id(girls_light_phys_on));
            call.perform();
          }

button:
  - platform: template
    name: "Girls Fan Breeze"
    icon: "mdi:weather-windy"
    on_press:
      - lambda: |-
          fan_rf.send(${girls_addr}, FAN_CMD_BREEZE);
          id(girls_rx)->execute(FAN_CMD_BREEZE);
  - platform: template
    name: "Girls Fan Timer 1H"
    icon: "mdi:timer-outline"
    on_press:
      - lambda: 'fan_rf.send(${girls_addr}, FAN_CMD_TIMER_1H);'
  - platform: template
    name: "Girls Fan Timer 4H"
    icon: "mdi:timer-outline"
    on_press:
      - lambda: 'fan_rf.send(${girls_addr}, FAN_CMD_TIMER_4H);'
  - platform: template
    name: "Girls Light Colour"
    icon: "mdi:palette"
    on_press:
      - lambda: 'fan_rf.send(${girls_addr}, FAN_CMD_COLOUR);'
  - platform: template
    name: "Girls Light Dim Up"
    icon: "mdi:brightness-7"
    on_press:
      - lambda: 'fan_rf.send(${girls_addr}, FAN_CMD_DIM_UP);'
  - platform: template
    name: "Girls Light Dim Down"
    icon: "mdi:brightness-5"
    on_press:
      - lambda: 'fan_rf.send(${girls_addr}, FAN_CMD_DIM_DOWN);'
  # The dimmer has somewhere around 7-8 steps and no absolute command, so
  # these overshoot to be sure of reaching the end.
  - platform: template
    name: "Girls Light Max"
    icon: "mdi:brightness-7"
    on_press:
      - lambda: 'for (int i = 0; i < 10; i++) fan_rf.send(${girls_addr}, FAN_CMD_DIM_UP);'
  - platform: template
    name: "Girls Light Min"
    icon: "mdi:brightness-4"
    on_press:
      - lambda: 'for (int i = 0; i < 10; i++) fan_rf.send(${girls_addr}, FAN_CMD_DIM_DOWN);'

  # ── Raw sender, for mapping new buttons ──
  - platform: template
    name: "Send Raw Command"
    icon: "mdi:send"
    entity_category: config
    on_press:
      - lambda: |-
          uint32_t addr = std::strtoul(id(raw_target).current_option().c_str(), nullptr, 16);
          fan_rf.send(addr, (uint16_t) id(raw_cmd_code).state);

select:
  - platform: template
    id: raw_target
    name: "Raw Command Target"
    entity_category: config
    optimistic: true
    options:
      - "E5D7C"          # girls

number:
  - platform: template
    id: raw_cmd_code
    name: "Raw Command Code"
    icon: "mdi:console"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 511
    step: 1
    initial_value: 0
    mode: box

switch:
  - platform: template
    name: "Sync Only (no RF)"
    icon: "mdi:sync"
    entity_category: config
    lambda: 'return id(sync_only);'
    turn_on_action:
      - lambda: 'id(sync_only) = true;'
    turn_off_action:
      - lambda: 'id(sync_only) = false;'
  - platform: template
    name: "Learn Mode"
    icon: "mdi:school"
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: 'fan_rf.learn_mode = true;'
    turn_off_action:
      - lambda: 'fan_rf.learn_mode = false;'
