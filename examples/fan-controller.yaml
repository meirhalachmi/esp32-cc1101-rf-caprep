# Minimal ESPHome config for Pacific ceiling fans through an ESP32 + CC1101.
# Put your WiFi credentials, API key and OTA password in secrets.yaml.

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller

esp32:
  board: esp32dev
  framework:
    type: arduino          # the CC1101 driver needs the Arduino framework

external_components:
  - source: github://meirhalachmi/esphome-pacific-fan
    components: [pacific_fan]

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Power, F/R and the light are toggles on these fans, so the tracked state
# has to survive a reboot promptly.
preferences:
  flash_write_interval: 5s

pacific_fan:
  # Pins default to the wiring in the README; override any of them here:
  # sck_pin: 18
  # miso_pin: 19
  # mosi_pin: 23
  # cs_pin: 5
  # gdo0_pin: 25
  # gdo2_pin: 26
  fans:
    # Don't know the address yet? Use `fans: []`, flash, turn on Learn Mode,
    # press a button on the remote and copy what the "Last Heard" sensor shows.
    - name: Bedroom
      address: 0xE5D7C
      parity: even
